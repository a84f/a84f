name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # roz raat 12 baje (UTC) automatically chalega
  workflow_dispatch: {}    # is se aap ise manually bhi "Run" kar sakte hain
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: a84f
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F472B6&color_dots=#161B22,#4C1D95,#6D28D9,#8B5CF6,#C4B5FD
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F472B6&color_dots=#21262D,#4C1D95,#6D28D9,#8B5CF6,#C4B5FD

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
